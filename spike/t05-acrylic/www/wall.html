<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0C1128; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); }
  .stripes { position: absolute; left: 0; right: 0; bottom: 0; height: 200px; background: #fff; padding: 24px 32px; box-sizing: border-box; }
  .stripes div { height: 10px; margin-bottom: 12px; border-radius: 3px; background: #D5D8DF; }
  .text { position: absolute; left: 40px; top: 30px; color: #fff; font: 600 28px system-ui; }
</style>
</head>
<body>
  <div class="blob" style="left:-60px; top:40px; width:380px; height:380px; background:#2F5BFF"></div>
  <div class="blob" style="right:-40px; top:200px; width:340px; height:340px; background:#7B3FE4"></div>
  <div class="blob" style="left:260px; top:380px; width:300px; height:300px; background:#10A6E8"></div>
  <div class="text">Окно под виджетом · текст для проверки размытия</div>
  <div class="stripes"><div style="width:95%"></div><div style="width:80%"></div><div style="width:90%"></div><div style="width:60%"></div><div style="width:85%"></div></div>
</body>
</html>
