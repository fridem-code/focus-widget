<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>widget</title>
<style>
  :root { --accent: #4C63E6; --accent-text: #AEBBFF; --accent-soft: rgba(76,99,230,0.24); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent;
    font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif; color: #F3F4F8; user-select: none; }
  .card { box-sizing: border-box; height: 100%; padding: 12px; display: flex; flex-direction: column; gap: 10px;
    background: rgba(22,24,33,0.62); border: 1px solid rgba(255,255,255,0.12); }
  /* variant=transparent: the window is a plain rectangle, CSS draws the 16px card */
  .transparent .card { border-radius: 16px; background: rgba(22,24,33,0.92); }
  .solid .card { background: #1F2129; border-color: rgba(255,255,255,0.08); }
  .bar { --wails-draggable: drag; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; font-size: 13px; font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; }
  #player { width: 356px; height: 204px; border-radius: 10px; overflow: hidden; background: #05060A; flex-shrink: 0; }
  .timer { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 4px; }
  .pill { padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-size: 12px; font-weight: 600; }
  .time { font-size: 76px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: #F6F7FB; }
  .progress { width: 260px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.14); }
  .progress div { width: 25%; height: 4px; border-radius: 2px; background: var(--accent-text); }
  .row { padding: 6px 12px; border-radius: 10px; background: rgba(255,255,255,0.07); font-size: 13px; }
  .row small { display: block; color: #A7ACBB; font-size: 12px; }
  .buttons { margin-top: auto; display: flex; justify-content: center; gap: 16px; padding-bottom: 4px; }
  .round { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.09); }
  .main { height: 48px; padding: 0 28px; border-radius: 24px; background: var(--accent); color: #fff; font: 600 15px inherit; display: flex; align-items: center; }
  /* compact */
  .compact .card { flex-direction: row; align-items: center; padding: 12px 12px 12px 18px; --wails-draggable: drag; }
  .compact .ctime { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; flex: 1; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
  const params = new URLSearchParams(location.search);
  const variant = params.get('variant');
  const compact = params.get('compact') === '1';
  document.body.classList.add(variant);
  window.__state = { variant, compact, events: [], focus: document.hasFocus() };
  window.addEventListener('focus', () => window.__state.events.push('window-focus'));
  window.addEventListener('blur', () => window.__state.events.push('window-blur'));

  const card = document.getElementById('card');
  if (compact) {
    document.body.classList.add('compact');
    card.innerHTML = '<div class="ctime">18:42</div><div class="round" style="background:#4C63E6"></div>';
  } else {
    card.innerHTML = `
      <div class="bar"><span><span class="dot"></span>Focus</span><span>⚙ ⤡ ✕</span></div>
      <div id="player"></div>
      <div class="timer"><div class="pill">Фокус · сессия 2 из 4</div><div class="time">18:42</div><div class="progress"><div></div></div></div>
      <div class="row">[Название видео]<small>Lo-fi · 3 / 12</small></div>
      <div class="buttons"><div class="round"></div><div class="main">Пауза</div><div class="round"></div></div>`;
    window.onYouTubeIframeAPIReady = () => {
      const p = new YT.Player('player', {
        width: 356, height: 204, videoId: 'CFGLoQIhmow',
        playerVars: { playsinline: 1, origin: location.origin },
        events: {
          onReady: () => { window.__state.ready = true; p.setVolume(15); p.playVideo(); },
          onStateChange: (e) => window.__state.events.push('state:' + e.data),
          onError: (e) => window.__state.events.push('error:' + e.data),
        },
      });
      window.__player = p;
    };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }
</script>
</body>
</html>
